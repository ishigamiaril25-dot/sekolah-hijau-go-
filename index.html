<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>🌱 RPG Sekolah Hijau - Custom Tileset LENGKAP</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
  color: white;
  height: 100vh;
  overflow: hidden;
}

#characterScreen, #gameScreen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#gameScreen { display: none; }

.character-creator {
  text-align: center;
  max-width: 600px;
  padding: 40px;
}

.character-title {
  font-size: 3em;
  margin-bottom: 20px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.char-preview {
  width: 200px;
  height: 200px;
  border: 4px solid #4CAF50;
  border-radius: 20px;
  margin: 20px auto;
  background: #2e7d32;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4em;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.char-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin: 30px 0;
}

.stat-input {
  background: rgba(255,255,255,0.1);
  border: 2px solid #4CAF50;
  border-radius: 15px;
  padding: 15px;
  color: white;
  font-size: 18px;
  text-align: center;
}

.stat-input:focus {
  outline: none;
  border-color: #81C784;
  box-shadow: 0 0 20px rgba(76,175,80,0.5);
}

.start-btn {
  padding: 20px 40px;
  font-size: 24px;
  background: linear-gradient(145deg, #4CAF50, #45a049);
  border: none;
  border-radius: 25px;
  color: white;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(76,175,80,0.4);
  transition: all 0.3s;
}

.start-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px rgba(76,175,80,0.6);
}

.game-container {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.game-canvas {
  flex: 1;
  background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 70%, #228B22 100%);
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

.ui-top {
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  z-index: 100;
}

.ui-stats {
  display: flex;
  gap: 15px;
}

.stat-box {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  padding: 15px 20px;
  border-radius: 15px;
  border: 2px solid rgba(255,255,255,0.3);
  min-width: 120px;
  text-align: center;
}

.stat-value {
  font-size: 24px;
  font-weight: bold;
  color: #4CAF50;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
}

.stat-label {
  font-size: 12px;
  opacity: 0.9;
}

.level-display {
  background: rgba(255,215,0,0.3);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
}

.dialogue {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(15px);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 25px;
  max-height: 200px;
  overflow-y: auto;
}

.dialogue-text {
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.dialogue-btn {
  padding: 15px 20px;
  background: linear-gradient(145deg, #4CAF50, #45a049);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s;
  width: 100%;
  margin-bottom: 10px;
}

.dialogue-btn:hover {
  background: linear-gradient(145deg, #45a049, #388e3c);
  transform: translateY(-2px);
}

@media (max-width: 768px) {
  .ui-stats { flex-direction: column; }
  .stat-box { min-width: 100px; }
}
</style>
</head>

<body>
<!-- CHARACTER CREATOR -->
<div id="characterScreen">
  <div class="character-creator">
    <h1 class="character-title">🌱 RPG Sekolah Hijau</h1>
    <p style="font-size: 1.5em; margin-bottom: 30px;">Ciptakan Eco-Warrior Mu!</p>
    
    <div class="char-preview" id="charPreview">🌿</div>
    
    <div style="margin: 30px 0; font-size: 1.3em;">
      Distribusikan 25 Poin Stat:
    </div>
    
    <div class="char-stats">
      <div>
        <label>🌍 Ekologi</label><br>
        <input type="number" class="stat-input" id="ecoPoints" min="1" max="15" value="6">
      </div>
      <div>
        <label>💰 Dana</label><br>
        <input type="number" class="stat-input" id="moneyPoints" min="1" max="15" value="6">
      </div>
      <div>
        <label>😊 Karisma</label><br>
        <input type="number" class="stat-input" id="charismaPoints" min="1" max="15" value="6">
      </div>
      <div>
        <label>📚 Pengetahuan</label><br>
        <input type="number" class="stat-input" id="knowledgePoints" min="1" max="15" value="7">
      </div>
    </div>
    
    <button class="start-btn" onclick="startGame()">🚀 Mulai Petualangan Sekolah Hijau!</button>
  </div>
</div>

<!-- MAIN GAME -->
<div id="gameScreen" class="game-container">
  <canvas class="game-canvas" id="gameCanvas" width="1200" height="800"></canvas>
  
  <div class="ui-top">
    <div class="ui-stats">
      <div class="stat-box">
        <div class="stat-label">🌍 Ekologi</div>
        <div class="stat-value" id="ecoStat">30</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">💰 Dana</div>
        <div class="stat-value" id="moneyStat">30</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">📚 Level</div>
        <div class="stat-value" id="levelStat">1</div>
      </div>
    </div>
    
    <div class="level-display">
      Quest <span id="questCounter">0</span>/8 | <span id="titleDisplay">Eco Warrior</span>
    </div>
  </div>
  
  <div class="dialogue" id="dialogueBox">
    <div class="dialogue-text" id="dialogueText">
      🎮 WASD untuk bergerak | 📍 Dekati NPC (kotak berwarna) untuk dialog<br>
      🌟 Tujuan: Selesaikan 8 quest lingkungan!
    </div>
    <div class="dialogue-options" id="dialogueOptions"></div>
  </div>
</div>

<script>
class EcoRPGGame {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.resizeCanvas();
    
    // Game stats
    this.stats = { eco: 30, money: 30, charisma: 30, knowledge: 35, level: 1, hp: 100 };
    this.questCount = 0;
    this.currentNPC = null;
    
    // Graphics
    this.tileSize = 32;
    this.setupTileset();
    this.setupSprites();
    
    // Game objects
    this.player = { x: 5*32+16, y: 5*32+16, dir: 0, frame: 0, speed: 4 };
    this.camera = { x: 0, y: 0 };
    this.keys = {};
    this.map = this.generateSchoolMap();
    this.npcs = this.generateNPCs();
    this.events = this.generateEvents();
    
    // Controls
    this.setupControls();
    this.gameLoop();
  }
  
  resizeCanvas() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }
  
  setupTileset() {
    this.tileset = {
      colors: ['#90EE90','#228B22','#8B4513','#D2B48C','#DEB887','#FF69B4','#8B4513','#32CD32']
    };
  }
  
  setupSprites() {
    this.characters = {
      player: { walk: ['#66BB6A','#4CAF50','#2E7D32'] },
      principal: { color: '#FF9800', hat: '#FF5722' },
      canteen: { color: '#2196F3', apron: '#42A5F5' },
      gardener: { color: '#9C27B0', hat: '#7B1FA2' },
      tech: { color: '#FF5722', helmet: '#F44336' }
    };
  }
  
  generateSchoolMap() {
    const map = Array(15).fill().map(() => Array(30).fill(0));
    
    // Borders
    for(let i=0; i<30; i++) {
      map[0][i] = 2; map[14][i] = 2; // Top bottom
      map[i%15][0] = 2; map[i%15][29] = 2; // Left right
    }
    
    // School building
    for(let y=2; y<5; y++) for(let x=3; x<7; x++) map[y][x] = 4;
    
    // Trees & decoration
    map[2][10] = 1; map[3][12] = 1; map[8][5] = 1; map[10][20] = 1;
    map[6][8] = 5; map[9][15] = 5; map[11][8] = 6; map[7][25] = 7;
    
    return map;
  }
  
  generateNPCs() {
    return [
      {x: 4, y: 3, type: 'principal', name: 'Pak Kepsek 🌿', quest: 0},
      {x: 25, y: 3, type: 'canteen', name: 'Bu Kantin 🍲', quest: 1},
      {x: 6, y: 8, type: 'gardener', name: 'Pak Tukang 🌱', quest: 2},
      {x: 21, y: 10, type: 'tech', name: 'Mas Surya ☀️', quest: 3}
    ];
  }
  
  generateEvents() {
    return [
      {
        q: "Pak Kepsek: Sekolah penuh plastik! Solusinya?",
        options: [
          {text: "Larang total + edukasi", effect: [25,-10,15,20], reward: "🌱"},
          {text: "Ganti sedotan bambu", effect: [18,-5,12,15], reward: "💧"},
          {text: "Kampanye daur ulang", effect: [15,0,18,12], reward: null}
        ]
      },
      {
        q: "Bu Kantin: Kantin zero waste?",
        options: [
          {text: "Zero waste premium", effect: [22,-15,20,22], reward: "☀️"},
          {text: "Bebas plastik", effect: [18,-8,15,18], reward: "🌱"},
          {text: "Menu vegetarian", effect: [15,-3,12,15], reward: "💧"}
        ]
      }
    ];
  }
  
  setupControls() {
    document.addEventListener('keydown', (e) => {
      this.keys[e.key.toLowerCase()] = true;
      if(e.key === 'Enter' && this.currentNPC) {
        this.showDialogue();
      }
      if(e.key === 'Escape') {
        this.hideDialogue();
      }
    });
    document.addEventListener('keyup', (e) => {
      this.keys[e.key.toLowerCase()] = false;
    });
  }
  
  update() {
    let moved = false;
    
    if(this.keys['w']) { this.player.y -= this.player.speed; this.player.dir = 0; moved = true; }
    if(this.keys['s']) { this.player.y += this.player.speed; this.player.dir = 2; moved = true; }
    if(this.keys['a']) { this.player.x -= this.player.speed; this.player.dir = 3; moved = true; }
    if(this.keys['d']) { this.player.x += this.player.speed; this.player.dir = 1; moved = true; }
    
    if(moved) this.player.frame = (this.player.frame + 0.3) % 3;
    
    this.handleCollisions();
    this.updateCamera();
    this.checkNPC();
    this.updateUI();
  }
  
  handleCollisions() {
    const mapX = Math.floor((this.player.x) / 32);
    const mapY = Math.floor((this.player.y) / 32);
    
    if(this.map[mapY] && this.map[mapY][mapX] === 2) {
      this.player.x -= (this.keys['d'] ? 4 : this.keys['a'] ? -4 : 0);
      this.player.y -= (this.keys['s'] ? 4 : this.keys['w'] ? -4 : 0);
    }
  }
  
  updateCamera() {
    this.camera.x = this.player.x - this.canvas.width / 2;
    this.camera.y = this.player.y - this.canvas.height / 2;
  }
  
  checkNPC() {
    const px = Math.floor(this.player.x / 32);
    const py = Math.floor(this.player.y / 32);
    
    for(let npc of this.npcs) {
      if(Math.abs(px - npc.x) <= 1 && Math.abs(py - npc.y) <= 1) {
        if(!this.currentNPC || this.currentNPC.quest !== npc.quest) {
          this.currentNPC = npc;
          document.getElementById('dialogueText').innerHTML = 
            `<strong>${npc.name}:</strong><br>${this.events[npc.quest].q}`;
        }
        return;
      }
    }
    if(this.currentNPC) {
      this.currentNPC = null;
      document.getElementById('dialogueText').innerHTML = 
        '🎮 WASD gerak | 📍 Dekati NPC warna-warni | ⏎ Enter dialog';
    }
  }
  
  showDialogue() {
    if(!this.currentNPC) return;
    const event = this.events[this.currentNPC.quest];
    const options = document.getElementById('dialogueOptions');
    options.innerHTML = '';
    
    event.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'dialogue-btn';
      btn.innerHTML = `${i+1}. ${opt.text}`;
      btn.onclick = () => this.completeQuest(i);
      options.appendChild(btn);
    });
  }
  
  completeQuest(optionIndex) {
    const event = this.events[this.currentNPC.quest];
    const opt = event.options[optionIndex];
    
    // Apply effects
    this.stats.eco = Math.min(100, this.stats.eco + opt.effect[0]);
    this.stats.money = Math.max(0, this.stats.money + opt.effect[1]);
    this.stats.charisma += opt.effect[2];
    this.stats.knowledge += opt.effect[3];
    
    this.questCount++;
    this.stats.level = Math.floor(this.questCount / 2) + 1;
    
    document.getElementById('dialogueOptions').innerHTML = '';
    document.getElementById('dialogueText').innerHTML = 
      `✅ Quest selesai! +${opt.effect[0]} Ekologi<br>
       Quest ${this.questCount}/8 ✅`;
    
    if(this.questCount >= 8) {
      setTimeout(() => alert(`🏆 SELAMAT! Sekolah Hijau Bersih!\n\nEkologi: ${this.stats.eco}\nLevel: ${this.stats.level}\n\nTekan F5 untuk main lagi! 🌍✨`), 1000);
    }
    
    this.currentNPC = null;
  }
  
  hideDialogue() {
    document.getElementById('dialogueOptions').innerHTML = '';
    this.currentNPC = null;
  }
  
  renderTile(x, y, type) {
    const screenX = x * this.tileSize - this.camera.x;
    const screenY = y * this.tileSize - this.camera.y;
    
    if(screenX < -this.tileSize || screenX > this.canvas.width || 
       screenY < -this.tileSize || screenY > this.canvas.height) return;
    
    this.ctx.save();
    this.ctx.translate(screenX, screenY);
    
    // [SAME RENDER TILE CODE - Grass, Tree, Wall, etc.]
    switch(type) {
      case 0: // Grass
        const grassG = this.ctx.createRadialGradient(16,16,0,16,16,16);
        grassG.addColorStop(0,'#98FB98'); grassG.addColorStop(1,'#228B22');
        this.ctx.fillStyle = grassG; this.ctx.fillRect(0,0,32,32);
        this.ctx.fillStyle = '#32CD32';
        this.ctx.fillRect(8,24,4,4); this.ctx.fillRect(20,20,4,4);
        break;
      case 1: // Tree
        this.ctx.fillStyle = '#8B4513'; this.ctx.fillRect(12,20,8,12);
        const treeG = this.ctx.createRadialGradient(16,8,0,16,8,16);
        treeG.addColorStop(0,'#32CD32'); treeG.addColorStop(1,'#006400');
        this.ctx.fillStyle = treeG;
        this.ctx.beginPath(); this.ctx.arc(16,8,14,0,Math.PI*2); this.ctx.fill();
        break;
      case 2: // Wall
        this.ctx.fillStyle = '#654321'; this.ctx.fillRect(0,0,32,32);
        this.ctx.fillStyle = '#DEB887'; this.ctx.fillRect(4,4,24,24);
        this.ctx.strokeStyle = '#8B4513'; this.ctx.lineWidth = 2;
        this.ctx.strokeRect(2,2,28,28);
        break;
      case 4: // School
        this.ctx.fillStyle = '#DEB887'; this.ctx.fillRect(0,8,32,24);
        this.ctx.fillStyle = '#87CEEB'; this.ctx.fillRect(8,12,16,8);
        this.ctx.fillStyle = '#FF4444'; this.ctx.fillRect(4,4,8,8);
        this.ctx.fillStyle = '#FFD700'; this.ctx.fillRect(20,6,4,4);
        break;
    }
    this.ctx.restore();
  }
  
  renderCharacter(x, y, type, dir = 0, frame = 0) {
    const screenX = x * this.tileSize - this.camera.x;
    const screenY = y * this.tileSize - this.camera.y;
    
    this.ctx.save();
    this.ctx.translate(screenX + 16, screenY + 16);
    
    if(type === 'player') {
      const colors = this.characters.player.walk;
      this.ctx.fillStyle = colors[Math.floor(frame) % 3];
      this.ctx.fillRect(-12,-20,24,32);
      this.ctx.fillStyle = '#FFE4B5'; this.ctx.fillRect(-8,-28,16,12);
      this.ctx.fillStyle = 'white'; 
      this.ctx.fillRect(-6,-24,4,4); this.ctx.fillRect(2,-24,4,4);
      this.ctx.fillStyle = '#333';
      this.ctx.fillRect(-4,-22,2,2); this.ctx.fillRect(4,-22,2,2);
      this.ctx.fillStyle = '#4CAF50';
      this.ctx.beginPath();
      this.ctx.moveTo(0,-10); this.ctx.lineTo(-6,-18); this.ctx.lineTo(6,-18);
      this.ctx.fill();
    } else {
      const npc = this.characters[type];
      this.ctx.fillStyle = npc.color; this.ctx.fillRect(-10,-18,20,28);
      this.ctx.fillStyle = '#FFE4B5'; this.ctx.fillRect(-6,-24,12,10);
      if(npc.hat) {
        this.ctx.fillStyle = npc.hat; this.ctx.fillRect(-8,-30,16,8);
      }
    }
    this.ctx.restore();
  }
  
  render() {
    this.ctx.fillStyle = '#87CEEB'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    
    // Map
    for(let y = 0; y < this.map.length; y++) {
      for(let x = 0; x < this.map[y].length; x++) {
        this.renderTile(x, y, this.map[y][x]);
      }
    }
    
    // NPCs
    this.npcs.forEach(npc => this.renderCharacter(npc.x, npc.y, npc.type));
    
    // Player (centered)
    this.renderCharacter(
      this.player.x / 32, this.player.y / 32, 'player', 
      this.player.dir, this.player.frame
    );
  }
  
  updateUI() {
    document.getElementById('ecoStat').textContent = this.stats.eco;
    document.getElementById('moneyStat').textContent = this.stats.money;
    document.getElementById('levelStat').textContent = this.stats.level;
    document.getElementById('questCounter').textContent = this.questCount;
  }
  
  gameLoop() {
    this.update();
    this.render();
    requestAnimationFrame(() => this.gameLoop());
  }
}

// GLOBAL FUNCTIONS
function startGame() {
  const eco = parseInt(document.getElementById('ecoPoints').value);
  const money = parseInt(document.getElementById('moneyPoints').value);
  const charisma = parseInt(document.getElementById('charismaPoints').value);
  const knowledge = parseInt(document.getElementById('knowledgePoints').value);
  
  if(eco + money + charisma + knowledge !== 25) {
    alert('❌ Total poin harus tepat 25!');
    return;
  }
  
  game.stats.eco = eco * 3;
  game.stats.money = money * 3;
  game.stats.charisma = charisma * 3;
  game.stats.knowledge = knowledge * 3;
  
  document.getElementById('characterScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
}

// INIT
let game;
window.addEventListener('load', () => {
  game = new EcoRPGGame();
  document.getElementById('charPreview').textContent = '🌿';
  
  window.addEventListener('resize', () => game.resizeCanvas());
});
</script>
</body>
</html>
